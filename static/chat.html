<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Syntrix AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e6e8ee;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid #232633;
      font-weight: 600;
      font-size: 18px;
    }
    header span { color: #7c8cff; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .user {
      align-self: flex-end;
      background: #7c8cff;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .bot {
      align-self: flex-start;
      background: #1c1f2b;
      border: 1px solid #2a2e3d;
      border-bottom-left-radius: 4px;
    }
    form {
      display: flex;
      gap: 12px;
      padding: 16px 24px;
      border-top: 1px solid #232633;
    }
    #input {
      flex: 1;
      padding: 14px 18px;
      border-radius: 24px;
      border: 1px solid #2a2e3d;
      background: #1c1f2b;
      color: #e6e8ee;
      font-size: 15px;
      outline: none;
    }
    #input:focus { border-color: #7c8cff; }
    button {
      padding: 0 22px;
      border-radius: 24px;
      border: none;
      background: #7c8cff;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #6a79e8; }
  </style>
</head>
<body>
  <header>Syntrix <span>AI</span></header>
  <div id="messages">
    <div class="msg bot">Hi! I'm Syntrix. Ask me anything about code or automotive engineering.</div>
  </div>
  <form id="chatForm">
    <input id="input" type="text" placeholder="Ask Syntrix anything..." autocomplete="off" />
    <button type="submit">Send</button>
  </form>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("input");
    const messages = document.getElementById("messages");

    function addMessage(text, who) {
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, "user");
      input.value = "";

      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      addMessage(data.reply, "bot");
    });
  </script>
</body>
</html>
